<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStall</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d131d;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .ui-layer * {
            pointer-events: auto;
        }

        .logo-container {
            margin-top: 50px;
            text-align: center;
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 4px;
            color: #d6e8ff;
            text-shadow: 
                0 0 10px rgba(85, 148, 255, 0.6),
                3px 3px 0px #1a2b4c,
                -2px -2px 0px #000;
        }

        .menu-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .menu-card {
            width: 160px;
            height: 170px;
            background: linear-gradient(180deg, #1b3152 0%, #112038 100%);
            border: 2px solid #2a4773;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .menu-card:hover {
            background: linear-gradient(180deg, #254473 0%, #182e52 100%);
            border-color: #538dcc;
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.6), 0 0 15px rgba(83, 141, 204, 0.3);
        }

        .menu-card svg {
            width: 60px;
            height: 60px;
            fill: #ffffff;
            margin-bottom: 20px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .menu-card span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-style: italic;
            font-size: 20px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px #000;
        }

        .footer-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .credits {
            font-size: 14px;
            color: #7a93b3;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px #000;
        }

        .bottom-bar {
            width: 100%;
            height: 40px;
            background: rgba(10, 18, 30, 0.9);
            border-top: 1px solid #1a2e4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .bottom-btn-group {
            display: flex;
            gap: 10px;
        }

        .bottom-btn {
            background: #16263d;
            border: 1px solid #2c4975;
            color: #c2d8f2;
            padding: 4px 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .bottom-btn:hover {
            background: #25406b;
            color: #fff;
        }

        .modal-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background: #112038;
            border: 2px solid #2a4773;
            padding: 20px;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .modal-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            border-bottom: 1px solid #2a4773;
            padding-bottom: 8px;
        }

        .close-btn {
            background: #a32a2a;
            color: white;
            border: none;
            padding: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            margin-top: 10px;
        }

        .close-btn:hover {
            background: #d43535;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            display: none;
            text-shadow: 2px 2px 4px #000;
        }

        #esc-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 16px;
            display: none;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 4px;
        }
    </style>
    <!-- Three.js Engine & FBX Support CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer" id="ui-layer">
        <div class="logo-container">
            <h1 class="logo-title">PlayStall</h1>
        </div>

        <div class="menu-grid">
            <div class="menu-card" onclick="openModal('garage-modal')">
                <svg viewBox="0 0 100 100">
                    <path d="M 15,25 H 35 V 35 H 15 Z M 65,25 H 85 V 35 H 65 Z M 15,65 H 35 V 75 H 15 Z M 65,65 H 85 V 75 H 65 Z M 30,30 H 70 L 80,45 V 55 L 70,70 H 30 L 20,55 V 45 Z" />
                </svg>
                <span>Garage</span>
            </div>

            <div class="menu-card" onclick="openModal('settings-modal')">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
                </svg>
                <span>Settings</span>
            </div>

            <div class="menu-card" onclick="startGame()">
                <svg viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span>Play</span>
            </div>
        </div>

        <div class="footer-container">
            <div class="credits">Music: Sci-Fi Theme</div>
            <div class="bottom-bar">
                <div class="bottom-btn-group">
                    <button class="bottom-btn" onclick="toggleMusic()">🎵 Track: <span id="track-name">Sci-Fi Theme</span></button>
                </div>
                <div class="bottom-btn-group">
                    <button class="bottom-btn" onclick="toggleFullscreen()">Fullscreen</button>
                </div>
            </div>
        </div>
    </div>

    <div id="garage-modal" class="modal-panel">
        <div class="modal-header">GARAGE</div>
        <p>Select Vehicle Color:</p>
        <div style="display:flex; gap:10px;">
            <button class="bottom-btn" style="background:#e74c3c" onclick="setCarColor(0xe74c3c)">Red</button>
            <button class="bottom-btn" style="background:#3498db" onclick="setCarColor(0x3498db)">Blue</button>
            <button class="bottom-btn" style="background:#2ecc71" onclick="setCarColor(0x2ecc71)">Green</button>
            <button class="bottom-btn" style="background:#f1c40f" onclick="setCarColor(0xf1c40f)">Yellow</button>
        </div>
        <button class="close-btn" onclick="closeModal('garage-modal')">CLOSE</button>
    </div>

    <div id="settings-modal" class="modal-panel">
        <div class="modal-header">SETTINGS</div>
        <p>Audio Track Selection:</p>
        <button class="bottom-btn" onclick="changeTrack(0)">1. Sci-Fi Theme</button>
        <button class="close-btn" onclick="closeModal('settings-modal')">CLOSE</button>
    </div>

    <div id="hud">SPEED: <span id="speedometer">0</span> KM/H</div>
    <div id="esc-hint">Press <b>ESC</b> to exit to menu</div>

    <audio id="bgm" loop></audio>

    <script>
        const playlist = [
            { name: "Sci-Fi Theme", file: "assets/sci-fi_theme.mp3" }
        ];
        let currentTrackIndex = 0;
        const audioPlayer = document.getElementById('bgm');

        function loadTrack(index) {
            currentTrackIndex = index;
            audioPlayer.src = playlist[index].file;
            document.getElementById('track-name').innerText = playlist[index].name;
            audioPlayer.play().catch(() => {});
        }

        function toggleMusic() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
        }

        function changeTrack(idx) {
            loadTrack(idx);
            closeModal('settings-modal');
        }

        window.addEventListener('click', () => {
            if (audioPlayer.paused && !audioPlayer.src) {
                loadTrack(0);
            }
        }, { once: true });

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        let scene, camera, renderer;
        let car = new THREE.Group();
        let fallbackBoxMesh;
        let carMaterial;
        let isPlaying = false;

        let speed = 0;
        let maxSpeed = 1.2;
        let accel = 0.015;
        let friction = 0.98;
        let turnSpeed = 0.03;
        let keys = {};

        function init3D() {
            if (scene) return;
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(100, 150, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const skyGeo = new THREE.SphereGeometry(800, 32, 15);
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('assets/skybox.jpg', (texture) => {
                const skyMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
                const skyDome = new THREE.Mesh(skyGeo, skyMat);
                scene.add(skyDome);
            }, undefined, () => {
                scene.background = new THREE.Color(0xa0c4ff);
            });

            scene.fog = new THREE.FogExp2(0xa0c4ff, 0.0005);

            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            createTrack();

            carMaterial = new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.2 });

            const bodyGeo = new THREE.BoxGeometry(1.2, 0.5, 2.4);
            fallbackBoxMesh = new THREE.Mesh(bodyGeo, carMaterial);
            fallbackBoxMesh.position.y = 0.4;
            car.add(fallbackBoxMesh);

            const fbxLoader = new THREE.FBXLoader();
            fbxLoader.load('assets/car.fbx', (loadedCar) => {
                const bbox = new THREE.Box3().setFromObject(loadedCar);
                const size = bbox.getSize(new THREE.Vector3());
                const center = bbox.getCenter(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 2.5 / (maxDim || 1);
                loadedCar.scale.set(scaleFactor, scaleFactor, scaleFactor);

                loadedCar.position.sub(center.multiplyScalar(scaleFactor));
                loadedCar.position.y += (size.y * scaleFactor) / 2;

                loadedCar.traverse((child) => {
                    if (child.isMesh) {
                        child.material = carMaterial;
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                car.remove(fallbackBoxMesh);
                car.add(loadedCar);
            }, undefined, (error) => {
                console.warn('Could not load assets/car.fbx', error);
            });

            scene.add(car);
            car.position.set(0, 0, 0);

            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
            window.addEventListener('keydown', e => {
                if(e.key === "Escape" && isPlaying) stopGame();
            });

            animate();
        }

        function setCarColor(hex) {
            if(carMaterial) carMaterial.color.setHex(hex);
        }

        function createTrack() {
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            for(let i = 0; i < 40; i++) {
                const segment = new THREE.Mesh(new THREE.BoxGeometry(6, 0.2, 10), trackMat);
                let angle = (i / 40) * Math.PI * 2;
                segment.position.set(Math.sin(angle) * 60, 0.1, Math.cos(angle) * 60);
                segment.rotation.y = angle + Math.PI / 2;
                segment.receiveShadow = true;
                scene.add(segment);
            }
        }

        function startGame() {
            isPlaying = true;
            audioPlayer.pause();

            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('esc-hint').style.display = 'block';
            car.position.set(0, 0, 60);
            car.rotation.set(0, Math.PI / 2, 0);
            speed = 0;
        }

        function stopGame() {
            isPlaying = false;
            audioPlayer.play().catch(() => {});

            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('esc-hint').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                if (keys['w'] || keys['arrowup']) speed = Math.min(speed + accel, maxSpeed);
                else if (keys['s'] || keys['arrowdown']) speed = Math.max(speed - accel, -maxSpeed / 2);
                else speed *= friction;

                if (keys['a'] || keys['arrowleft']) car.rotation.y += turnSpeed * (speed / maxSpeed);
                if (keys['d'] || keys['arrowright']) car.rotation.y -= turnSpeed * (speed / maxSpeed);

                car.translateZ(speed);

                const relativeCamOffset = new THREE.Vector3(0, 4, -8);
                const camOffset = relativeCamOffset.applyMatrix4(car.matrixWorld);
                camera.position.lerp(camOffset, 0.1);
                camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

                document.getElementById('speedometer').innerText = Math.round(Math.abs(speed) * 180);
            } else {
                const time = Date.now() * 0.0005;
                camera.position.x = Math.sin(time) * 15;
                camera.position.z = Math.cos(time) * 15;
                camera.position.y = 8;
                camera.lookAt(0, 0, 0);
            }

            renderer.render(scene, camera);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init3D);
        } else {
            init3D();
        }
    </script>
</body>
</html>
