<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoleBlocks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #7EC0EE;
      font-family: sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    // --- PLAYER IDENTITY ---
    const LOCAL_PLAYER_ID = 'p_' + Math.random().toString(36).substr(2, 7);
    const PLAYER_COLOR = Math.floor(Math.random() * 0xffffff);

    // --- THREE.JS SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7EC0EE);
    scene.fog = new THREE.FogExp2(0x7EC0EE, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(30, 50, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 150;
    const d = 50;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // --- CANNON.JS PHYSICS ---
    const world = new CANNON.World();
    world.gravity.set(0, -22, 0);
    world.broadphase = new CANNON.NaiveBroadphase();
    world.solver.iterations = 10;

    const physicsMaterial = new CANNON.Material('slipperyMaterial');
    const contactMat = new CANNON.ContactMaterial(physicsMaterial, physicsMaterial, { friction: 0.0, restitution: 0.0 });
    world.addContactMaterial(contactMat);

    // --- BASEPLATE / GROUND ---
    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    const groundShape = new CANNON.Plane();
    const groundBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
    groundBody.addShape(groundShape);
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    // --- CAPSULE CREATOR ---
    function createCapsuleMesh(color) {
      const group = new THREE.Group();
      const radius = 0.5;
      const height = 1.0;

      const mat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.4,
        transparent: true,
        opacity: 1.0
      });

      const cylGeo = new THREE.CylinderGeometry(radius, radius, height, 16);
      const cylMesh = new THREE.Mesh(cylGeo, mat);
      cylMesh.position.y = 1.0;
      cylMesh.castShadow = true;
      cylMesh.receiveShadow = true;
      group.add(cylMesh);

      const topGeo = new THREE.SphereGeometry(radius, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const topMesh = new THREE.Mesh(topGeo, mat);
      topMesh.position.y = 1.5;
      topMesh.castShadow = true;
      topMesh.receiveShadow = true;
      group.add(topMesh);

      const botGeo = new THREE.SphereGeometry(radius, 16, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
      const botMesh = new THREE.Mesh(botGeo, mat);
      botMesh.position.y = 0.5;
      botMesh.castShadow = true;
      botMesh.receiveShadow = true;
      group.add(botMesh);

      return { group, materials: [mat] };
    }

    // --- LOCAL PLAYER PHYSICS & MODEL ---
    const spawnX = (Math.random() - 0.5) * 10;
    const spawnZ = (Math.random() - 0.5) * 10;

    const localCapsule = createCapsuleMesh(PLAYER_COLOR);
    scene.add(localCapsule.group);

    const playerRadius = 0.5;
    const playerHeight = 2.0;

    const playerBody = new CANNON.Body({
      mass: 5,
      material: physicsMaterial,
      fixedRotation: true
    });

    const sphereShape = new CANNON.Sphere(playerRadius);
    playerBody.addShape(sphereShape, new CANNON.Vec3(0, playerRadius, 0));
    playerBody.addShape(sphereShape, new CANNON.Vec3(0, playerHeight - playerRadius, 0));
    playerBody.position.set(spawnX, 0, spawnZ);
    world.addBody(playerBody);

    // --- RELIABLE GROUNDED & JUMP LOGIC ---
    function checkGrounded() {
      return Math.abs(playerBody.position.y) < 0.15 && Math.abs(playerBody.velocity.y) < 1.5;
    }

    // --- CONTROLS & CAMERA STATE ---
    const keys = { w: false, a: false, s: false, d: false, i: false, o: false };
    let cameraDistance = 4.5;
    const minDistance = 0.0; // 0.0 triggers true First-Person mode
    const maxDistance = 14.0;
    let cameraYaw = 0;
    let cameraPitch = 0.1;

    let isMouseDown = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') keys.w = true;
      if (e.code === 'KeyS') keys.s = true;
      if (e.code === 'KeyA') keys.a = true;
      if (e.code === 'KeyD') keys.d = true;
      if (e.code === 'KeyI') keys.i = true;
      if (e.code === 'KeyO') keys.o = true;
      if (e.code === 'Space') {
        if (checkGrounded()) {
          playerBody.velocity.y = 9.5;
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') keys.w = false;
      if (e.code === 'KeyS') keys.s = false;
      if (e.code === 'KeyA') keys.a = false;
      if (e.code === 'KeyD') keys.d = false;
      if (e.code === 'KeyI') keys.i = false;
      if (e.code === 'KeyO') keys.o = false;
    });

    // Mouse Drag Camera Angle
    document.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    document.addEventListener('mouseup', () => isMouseDown = false);

    document.addEventListener('mousemove', (e) => {
      if (isMouseDown) {
        const deltaX = e.clientX - lastMouseX;
        const deltaY = e.clientY - lastMouseY;
        cameraYaw -= deltaX * 0.005;
        cameraPitch -= deltaY * 0.005;
        cameraPitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, cameraPitch));
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      }
    });

    document.addEventListener('wheel', (e) => {
      cameraDistance += e.deltaY * 0.005;
      cameraDistance = Math.max(minDistance, Math.min(maxDistance, cameraDistance));
    });

    // --- MULTIPLAYER ---
    const remotePlayers = {};

    function updateRemotePlayer(data) {
      if (!data || data.id === LOCAL_PLAYER_ID) return;
      if (!remotePlayers[data.id]) {
        const capsule = createCapsuleMesh(data.color);
        scene.add(capsule.group);
        remotePlayers[data.id] = { mesh: capsule.group, lastSeen: Date.now() };
      }
      const p = remotePlayers[data.id];
      p.mesh.position.set(data.x, data.y, data.z);
      p.mesh.rotation.y = data.yaw;
      p.lastSeen = Date.now();
    }

    const localChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('game_sync') : null;
    if (localChannel) {
      localChannel.onmessage = (e) => updateRemotePlayer(e.data);
    }

    const peerConnections = {};
    const peer = new Peer(LOCAL_PLAYER_ID + '_' + Math.floor(Math.random()*1000));

    peer.on('open', () => {
      setInterval(() => broadcastState(), 50);
    });

    peer.on('connection', (conn) => {
      conn.on('data', (data) => updateRemotePlayer(data));
      peerConnections[conn.peer] = conn;
    });

    function broadcastState() {
      const state = {
        id: LOCAL_PLAYER_ID,
        color: PLAYER_COLOR,
        x: playerBody.position.x,
        y: playerBody.position.y,
        z: playerBody.position.z,
        yaw: cameraYaw,
        time: Date.now()
      };
      
      if (localChannel) localChannel.postMessage(state);

      for (const pId in peerConnections) {
        if (peerConnections[pId].open) {
          peerConnections[pId].send(state);
        }
      }
    }

    setInterval(() => {
      const now = Date.now();
      const TIMEOUT = 20 * 60 * 1000;
      for (const id in remotePlayers) {
        if (now - remotePlayers[id].lastSeen > TIMEOUT) {
          scene.remove(remotePlayers[id].mesh);
          delete remotePlayers[id];
        }
      }
    }, 5000);

    // --- GAME LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      world.step(1 / 60, delta, 3);

      // Keyboard Zoom Controls (I and O)
      if (keys.i) cameraDistance -= 4.0 * delta;
      if (keys.o) cameraDistance += 4.0 * delta;
      cameraDistance = Math.max(minDistance, Math.min(maxDistance, cameraDistance));

      // Synchronize capsule mesh position & orientation
      localCapsule.group.position.copy(playerBody.position);
      localCapsule.group.rotation.y = cameraYaw;

      // WASD Movement
      const speed = 7.5;
      let moveX = 0;
      let moveZ = 0;

      if (keys.w) moveZ -= 1;
      if (keys.s) moveZ += 1;
      if (keys.a) moveX -= 1;
      if (keys.d) moveX += 1;

      if (moveX !== 0 || moveZ !== 0) {
        const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
        moveX /= len;
        moveZ /= len;

        const sin = Math.sin(cameraYaw);
        const cos = Math.cos(cameraYaw);

        playerBody.velocity.x = (moveX * cos + moveZ * sin) * speed;
        playerBody.velocity.z = (-moveX * sin + moveZ * cos) * speed;
      } else {
        playerBody.velocity.x *= 0.82;
        playerBody.velocity.z *= 0.82;
      }

      // Check if fully zoomed into First Person mode
      const isFirstPerson = cameraDistance <= 0.25;

      if (isFirstPerson) {
        // --- FIRST PERSON CAMERA LOGIC ---
        const eyeLevel = new THREE.Vector3(
          playerBody.position.x,
          playerBody.position.y + 1.6,
          playerBody.position.z
        );

        camera.position.copy(eyeLevel);

        // Look direction calculated from pitch & yaw
        const lookTarget = new THREE.Vector3(
          eyeLevel.x - Math.sin(cameraYaw) * Math.cos(cameraPitch),
          eyeLevel.y + Math.sin(cameraPitch),
          eyeLevel.z - Math.cos(cameraYaw) * Math.cos(cameraPitch)
        );

        camera.lookAt(lookTarget);

        // Completely hide local player capsule in First Person
        localCapsule.materials.forEach(mat => {
          mat.opacity = 0;
          mat.visible = false;
        });

      } else {
        // --- THIRD PERSON CAMERA LOGIC ---
        const targetPos = new THREE.Vector3(
          playerBody.position.x,
          playerBody.position.y + 1.2,
          playerBody.position.z
        );

        const cx = targetPos.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
        let cy = targetPos.y + cameraDistance * Math.sin(cameraPitch);
        const cz = targetPos.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);

        cy = Math.max(0.35, cy); // Prevent dipping below ground plate

        camera.position.set(cx, cy, cz);
        camera.lookAt(targetPos);

        // Dynamic Transparency transition on zoom approach
        const currentDist = camera.position.distanceTo(targetPos);
        const fadeStart = 2.2;
        const fadeEnd = 0.45;

        let opacity = 1.0;
        if (currentDist < fadeStart) {
          opacity = (currentDist - fadeEnd) / (fadeStart - fadeEnd);
          opacity = Math.max(0, Math.min(1, opacity));
        }

        localCapsule.materials.forEach(mat => {
          mat.opacity = opacity;
          mat.visible = opacity > 0.02;
        });
      }

      broadcastState();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
